name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Sunucu ve web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/camnotlar_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dosya boyutu sınırı (1000 satır)
        run: node scripts/check-lines.mjs
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Birim ve entegrasyon testleri
        run: npm test
      - name: Derleme
        run: npm run build
      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Uçtan uca testler
        run: npx playwright test
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ve derleme
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: İmzalı sürüm APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CAMNOTLAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAMNOTLAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAMNOTLAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          CAMNOTLAR_KEYSTORE=$PWD/release.jks ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/android/app/build/outputs/apk/**/*.apk

  docker:
    name: Docker imajları
    runs-on: ubuntu-latest
    needs: [node]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: ghcr.io girişi
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sürüm etiketi
        id: v
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: API imajı (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.v.outputs.prefix }}/camnotlar-api:${{ steps.v.outputs.version }}
      - name: Web imajı (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.v.outputs.prefix }}/camnotlar-web:${{ steps.v.outputs.version }}
